[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minicoder"
version = "0.3.0"
description = "一个可读、可扩展的 Python LLM Agent，支持安全工具调用、汽车任务规划与中文本地 RAG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rgfan123" }]
dependencies = [
    "httpx>=0.27",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
automotive = [
    "fastapi>=0.115,<0.129",
    "jieba>=0.42,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
minicoder = "minicoder.cli:main"
minicoder-vehicle-api = "minicoder.vehicle.mock_server:main"

[tool.hatch.build.targets.wheel]
packages = ["minicoder"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: offline end-to-end tests that use local subprocesses and HTTP servers",
]

[tool.coverage.run]
branch = true
source = ["minicoder"]

[tool.coverage.report]
fail_under = 85
precision = 1
show_missing = true
skip_covered = true
